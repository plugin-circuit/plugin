name: build_test

# Build and test on every push and pull request, with plugin-circuit/ci-actions (pinned).
# macOS: everything (the plugin formats, the test WCLAPs, all tests but the GUI ones).
# Windows: the plugin (CLAP, VST3, standalone), the test WCLAPs (the runner's preinstalled LLVM) and the non-GUI tests.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build_test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-15
            llvm: "true"
            args: ""
          - name: Windows-x86_64
            os: windows-2022
            llvm: "false"
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: plugin-circuit/ci-actions/setup-build-tools@v0.1.2
        with:
          LLVM: ${{ matrix.llvm }}
      - uses: plugin-circuit/ci-actions/cache-deps@v0.1.2
      - uses: plugin-circuit/ci-actions/cmake-build@v0.1.2
        with:
          BUILD_TYPE: RelWithDebInfo
          CMAKE_BUILD_ARGS: ${{ matrix.args }}
          KEEP_GOING: ${{ startsWith(matrix.name, 'Windows') }} # while porting: every Windows error in one run
      # GUI tests (label gui) need a window session; they run locally for now
      - uses: plugin-circuit/ci-actions/cmake-test@v0.1.2
        with:
          EXCLUDE_LABELS: gui
      # a crash on Windows prints nothing: rerun one WCLAP test under cdb for the stack
      - name: crash stack (Windows)
        if: failure() && startsWith(matrix.name, 'Windows')
        shell: pwsh
        run: |
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue
          if (-not $cdb) { Write-Output "cdb not found"; exit 0 }
          $env:PLUGINCIRCUIT_HOME = "$PWD\build\smoke-home"
          & $cdb.FullName -g -G -lines -y "$PWD\build" -c ".lines -e; .ecxr; kpn 40; q" build\plugincircuit-smoke.exe build\test-wclaps\dist\test-gain.wclap.tar.gz --json
